name: ROCm Nightly Build and Test

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rocm_version:
        description: ROCm version to build
        required: false
        type: string
  workflow_call:
    inputs:
      rocm_version:
        required: false
        type: string
  push:
    branches:
      - rocm-nightly-gha

env:
  ROCM_VERSION: '7.2.2'
  PYTHON_VERSION: '3.10'
  PYTORCH_ROCM_ARCH: 'gfx906;gfx908;gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201'
  DOCKER_REGISTRY: rocm/pytorch-nightly

jobs:
  build:
    name: Build ROCm Nightly Image
    runs-on: linux-pytorch-mi325-1
    timeout-minutes: 720
    outputs:
      full-image: ${{ steps.meta.outputs.full-image }}
    steps:
      - name: Resolve ROCm version
        if: ${{ inputs.rocm_version != '' }}
        run: echo "ROCM_VERSION=${{ inputs.rocm_version }}" >> "$GITHUB_ENV"

      - name: Checkout pytorch
        uses: actions/checkout@v6
        with:
          repository: pytorch/pytorch
          ref: main

      - name: Checkout nightly workflow files
        uses: actions/checkout@v6
        with:
          path: rocm-nightly-workflow

      - name: Patch rocm-n build.sh version
        run: |
          sed -i '/pytorch-linux-jammy-rocm-n-py3 | pytorch-linux-jammy-rocm-n-py3-benchmarks | pytorch-linux-noble-rocm-n-py3)/,/;;/ s/ROCM_VERSION=7\.2/ROCM_VERSION=${{ env.ROCM_VERSION }}/' .ci/docker/build.sh
          sed -n '/pytorch-linux-jammy-rocm-n-py3 | pytorch-linux-jammy-rocm-n-py3-benchmarks | pytorch-linux-noble-rocm-n-py3)/,/;;/p' .ci/docker/build.sh

      - name: Pin sccache version
        # install_cache.sh downloads an AMD-prebuilt sccache from
        # repo.radeon.com for the ROCm path. That binary (reports as v0.10.0)
        # crashes with "Failed to parse included file path" on some HIP
        # compiles, same as mozilla v0.13.0. Replace the AMD download with
        # an upstream mozilla release tarball so we can try intermediate
        # versions.
        env:
          SCCACHE_VERSION: v0.14.0
        run: |
          set -euo pipefail
          TARBALL="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          EXTRACTED="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
          NEW_CMD="curl --retry 3 -L https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${TARBALL} -o /tmp/${TARBALL} \&\& tar -xzf /tmp/${TARBALL} -C /tmp \&\& mv /tmp/${EXTRACTED}/sccache /opt/cache/bin/sccache \&\& rm -rf /tmp/${TARBALL} /tmp/${EXTRACTED}"
          sed -i "s|curl --retry 3 http://repo.radeon.com/misc/.sccache_amd/sccache -o /opt/cache/bin/sccache|${NEW_CMD}|" .ci/docker/common/install_cache.sh
          sed -i "s|git clone https://github.com/mozilla/sccache -b v0\\.13\\.0|git clone https://github.com/mozilla/sccache -b ${SCCACHE_VERSION}|" .ci/docker/common/install_cache.sh
          grep -nE 'sccache|radeon.com' .ci/docker/common/install_cache.sh | head -10

      - name: Generate image tag
        id: meta
        run: |
          tag="$(date +%Y%m%d%H%M%S)-rocm${{ env.ROCM_VERSION }}"
          echo "full-image=${{ env.DOCKER_REGISTRY }}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build base image
        working-directory: .ci/docker
        run: |
          export SKIP_SCCACHE_INSTALL=1
          export PYTORCH_ROCM_ARCH="${{ env.PYTORCH_ROCM_ARCH }}"
          ./build.sh pytorch-linux-jammy-rocm-n-py3 \
            -t rocm/pytorch-autobuild:base-latest

      - name: Build ROCm Nightly Image
        env:
          FULL_IMAGE: ${{ steps.meta.outputs.full-image }}
        # Run the pytorch/vision/audio builds via `docker run` (not a
        # Dockerfile RUN) and `docker commit` the container to produce the
        # nightly image. BuildKit truncates long RUN output server-side even
        # with `--progress=plain`, so compile errors get hidden behind
        # warning spam. Writing logs inside the container and `docker cp`ing
        # them out after the run captures the full untruncated output for
        # post-mortem without relying on bind-mount permissions.
        run: |
          set -uo pipefail
          docker rm -f nightly-build 2>/dev/null || true
          rm -rf build-artifacts

          docker run --name nightly-build \
            --entrypoint bash \
            rocm/pytorch-autobuild:base-latest \
            -c '
              set -euo pipefail
              export CI=1
              export PYTORCH_TEST_WITH_ROCM=1
              export PYTORCH_TESTING_DEVICE_ONLY_FOR=cuda
              mkdir -p /tmp/logs
              cd /tmp

              git clone https://github.com/pytorch/pytorch --recursive
              cd pytorch
              pip install -r requirements.txt
              git config --local user.name "AMD AMD"
              git config --local user.email "amd@amd.com"
              git remote add rocm https://github.com/ROCm/pytorch.git
              git fetch rocm
              git cherry-pick 519160d466782f5a62365be051fcb3ef90fa0b00
              .ci/pytorch/build.sh 2>&1 | tee /tmp/logs/build.log
              rm -rf /tmp/pytorch/.git

              cd /tmp
              git clone https://github.com/pytorch/vision
              cd vision
              FORCE_CUDA=1 python setup.py install 2>&1 | tee /tmp/logs/vision-build.log
              rm -rf /tmp/vision/.git

              cd /tmp
              git clone https://github.com/pytorch/audio
              cd audio
              python setup.py install 2>&1 | tee /tmp/logs/audio-build.log
              rm -rf /tmp/audio/.git
            '
          run_exit=$?

          # Extract logs even on failure so the artifact upload can ship them.
          docker cp nightly-build:/tmp/logs build-artifacts 2>/dev/null || true

          if [ "$run_exit" -ne 0 ]; then
            docker rm nightly-build 2>/dev/null || true
            exit "$run_exit"
          fi

          docker commit \
            --change 'ENV CI=1' \
            --change 'ENV PYTORCH_TEST_WITH_ROCM=1' \
            --change 'ENV PYTORCH_TESTING_DEVICE_ONLY_FOR=cuda' \
            --change 'WORKDIR /tmp' \
            nightly-build "$FULL_IMAGE"
          docker rm nightly-build

      - name: Upload full build logs
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: nightly-build-logs
          path: build-artifacts/
          retention-days: 7

      - name: Save nightly image artifact
        env:
          FULL_IMAGE: ${{ steps.meta.outputs.full-image }}
        run: |
          docker save -o nightly-image.tar "$FULL_IMAGE"

      - name: Upload nightly image artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: rocm-nightly-image
          path: nightly-image.tar
          retention-days: 1
          compression-level: 0

  test-push:
    name: ${{ matrix.target.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Test and Push ROCm Nightly Image on MI325
            runner: linux-pytorch-mi325-1
            push_image: true
          - name: Test ROCm Nightly Image on MI250
            runner: linux-pytorch-mi250-1
            push_image: false
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 720
    env:
      NIGHTLY_IMAGE: ${{ needs.build.outputs.full-image }}
    steps:
      - name: Resolve ROCm version
        if: ${{ inputs.rocm_version != '' }}
        run: echo "ROCM_VERSION=${{ inputs.rocm_version }}" >> "$GITHUB_ENV"

      - name: Docker cleanup
        run: |
          docker container prune -f
          docker image prune -f

      - name: Download nightly image artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: rocm-nightly-image
          path: nightly-image-artifact

      - name: Load nightly image
        run: docker load -i nightly-image-artifact/nightly-image.tar

      - name: Run unit tests
        run: |
          docker run --rm \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add video \
            --network host \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            "$NIGHTLY_IMAGE" \
            bash -c "
              git clone https://github.com/ROCm/pytorch-micro-benchmarking.git /tmp/pytorch-micro-benchmarking
              cd /tmp/pytorch-micro-benchmarking
              python3 micro_benchmarking_pytorch.py --network resnet50
            "

      - name: Log in to Docker Hub
        if: ${{ matrix.target.push_image }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push validated image
        if: ${{ matrix.target.push_image }}
        env:
          FINAL_IMAGE: ${{ needs.build.outputs.full-image }}
          LATEST_IMAGE: ${{ env.DOCKER_REGISTRY }}:latest
        run: |
          docker tag "$FINAL_IMAGE" "$LATEST_IMAGE"
          docker push "$FINAL_IMAGE"
          docker push "$LATEST_IMAGE"
