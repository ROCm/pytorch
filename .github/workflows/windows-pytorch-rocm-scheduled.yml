# Windows PyTorch (ROCm) wheel build, scheduled.
#
# Builds the PyTorch wheel with ROCm on a Windows runner, once a day and on demand.
#   - cron: builds the tip of main of pytorch/pytorch at the time the run starts
#   - manual (workflow_dispatch): builds the commit given in the `sha` input, or the tip of
#     main when it is left empty
# Same shape as pytorch/crcr-test crcr-nightly-health.yml (cron + workflow_dispatch + a
# resolve-sha job); the build underneath is the TheRock-free build:
#   - the PyTorch source is cloned with plain git
#   - the ROCm SDK is installed with pip from a package index
#   - the build tools (Git for Windows, Visual Studio Build Tools, CMake) are installed by
#     .github/scripts/windows-build-env/setup-build-env.ps1 when the machine lacks them
#   - the build itself is .github/scripts/windows-rocm-build/build_pytorch_rocm.py, which
#     ends in `python -m build --wheel --no-isolation`
# After a successful build, a second job installs the wheel on a fresh VM and runs the
# PyTorch test suites (see the comment above the `test` job). Nothing is reported to CRCR yet.
# A schedule or workflow_dispatch workflow runs from the default branch only.

name: Windows PyTorch ROCm scheduled build

on:
  # TEMPORARY, for testing on this branch before the workflow moves to the CRCR repository:
  # a push that changes this file starts a run (no inputs, so the defaults apply and the
  # tip of main is built). Remove this block when the file moves.
  push:
    branches:
      - windows-rocm-ci-bringup
    paths:
      - .github/workflows/windows-pytorch-rocm-scheduled.yml
  schedule:
    - cron: "20 9 * * *"  # daily at 09:20 UTC
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (40 characters) of pytorch_repository to build. Leave empty for the tip of main."
        type: string
        required: false
        default: ""
      rocm_arch:
        description: GPU targets to build for, separated by semicolons.
        type: string
        default: "gfx1200;gfx1201"
      pytorch_repository:
        description: GitHub repository to build (owner/name).
        type: string
        default: "pytorch/pytorch"
      python_version:
        description: Python version.
        type: string
        default: "3.12"
      rocm_version:
        description: ROCm SDK package version to install and build against (must exist on the index).
        type: string
        default: "10.1.0"
      rocm_index_url:
        description: pip index that serves the rocm packages.
        type: string
        default: "https://stable.repo.amd.com/rocm/whl-next/"
      max_jobs:
        description: Maximum parallel compile jobs (the R9700 VM has about 32 GB RAM).
        type: string
        default: "8"
      runner_labels:
        description: Runner labels as a JSON array.
        type: string
        default: '["self-hosted","Windows","xsj-dispatch","radeon-r9700"]'
      skip_tests:
        description: Build only, do not run the test job afterwards.
        type: boolean
        default: false
      test_device_extras:
        description: >-
          pip extras of the rocm package that carry the GPU kernels for the test machine
          (comma separated, no spaces).
        type: string
        default: "device-gfx1200,device-gfx1201"

run-name: >-
  Windows PyTorch ROCm build -
  ${{ github.event_name == 'schedule' && 'cron' || (github.event_name == 'push' && 'push test' || 'manual') }}
  (${{ inputs.sha || 'main tip' }}, ${{ inputs.rocm_arch || 'gfx1200;gfx1201' }})

# One build at a time on the shared Windows runner; a new run waits instead of cancelling.
concurrency:
  group: windows-pytorch-rocm-scheduled
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-sha:
    name: resolve-sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the PyTorch SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          PYTORCH_REPOSITORY: ${{ inputs.pytorch_repository || 'pytorch/pytorch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA}" ]; then
            SHA="${INPUT_SHA}"
            echo "Using the SHA given as input: ${SHA}"
          else
            SHA=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${PYTORCH_REPOSITORY}/commits/main" | jq -r '.sha')
            echo "Tip of main of ${PYTORCH_REPOSITORY}: ${SHA}"
          fi
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Not a 40-character commit SHA: '${SHA}'"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "### PyTorch commit to build" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${PYTORCH_REPOSITORY}@${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build | ${{ inputs.rocm_arch || 'gfx1200;gfx1201' }}
    needs: resolve-sha
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted","Windows","xsj-dispatch","radeon-r9700"]') }}
    timeout-minutes: 240
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      PYTORCH_REPOSITORY: ${{ inputs.pytorch_repository || 'pytorch/pytorch' }}
      PYTORCH_REF: ${{ needs.resolve-sha.outputs.sha }}
      ROCM_ARCH: ${{ inputs.rocm_arch || 'gfx1200;gfx1201' }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.1.0' }}
      ROCM_INDEX_URL: ${{ inputs.rocm_index_url || 'https://stable.repo.amd.com/rocm/whl-next/' }}
      MAX_JOBS: ${{ inputs.max_jobs || '8' }}
      # Short source path: the Windows compile command lines get very long in this tree.
      # One runner per VM, so jobs do not share this folder.
      SOURCE_DIR: C:/pytorch
      PACKAGE_DIST_DIR: ${{ github.workspace }}\output\packages\dist
    defaults:
      run:
        shell: bash
    steps:
      # The machine may be bare, so the first steps use PowerShell: bash does not exist
      # until Git for Windows is installed.
      - name: Enable git long paths (if git is installed)
        shell: powershell
        run: |
          if (Get-Command git -ErrorAction SilentlyContinue) {
            git config --global core.longpaths true
            'core.longpaths set'
          } else {
            'git is not installed yet: the checkout will use the REST API'
          }

      - name: Checkout the build scripts (this repository, sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/windows-build-env
            .github/scripts/windows-rocm-build
          sparse-checkout-cone-mode: true

      - name: Install missing build tools
        shell: powershell
        run: |
          # -SkipPython: this workflow gets Python from actions/setup-python.
          & ./.github/scripts/windows-build-env/setup-build-env.ps1 -SkipPython
          if ($LASTEXITCODE -ne 0) { throw "setup-build-env.ps1 exited with $LASTEXITCODE" }

      - name: Disk free (before)
        shell: powershell
        run: |
          $c = Get-PSDrive -Name C
          "C: used {0} GB, free {1} GB" -f [math]::Round($c.Used/1GB,1), [math]::Round($c.Free/1GB,1)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PyTorch's Gloo (torch.distributed) needs libuv on Windows. Built from a fixed
      # version, whatever PyTorch ref is built; the build script copies uv.dll into torch/lib.
      - name: Build libuv from source
        run: |
          git clone https://github.com/libuv/libuv.git -b v1.47.0 --depth 1
          cmake -S libuv -B libuv/build -DBUILD_TESTING=OFF
          cmake --build libuv/build --config Release
          cmake --install libuv/build --prefix "${{ github.workspace }}/libuv-install"
          echo "libuv_ROOT=${{ github.workspace }}/libuv-install" >> $GITHUB_ENV

      # After the other installs, so MSVC gets priority in PATH.
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Clone PyTorch
        timeout-minutes: 45
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          rm -rf "${SOURCE_DIR}"
          mkdir -p "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          git init --initial-branch=main
          git config advice.detachedHead false
          git remote add origin "https://github.com/${PYTORCH_REPOSITORY}.git"
          git fetch -j 10 origin "${PYTORCH_REF}"
          git checkout FETCH_HEAD
          git submodule update --init --recursive -j 10
          echo "PyTorch source:"
          git log -1 --format='%H %s'

      # Records physical memory use every 20 s while the build runs.
      - name: Start memory sampler
        shell: powershell
        run: |
          $script = @'
          $log = Join-Path $env:RUNNER_TEMP 'memory-log.csv'
          'time,used_gb,free_gb' | Out-File $log -Encoding ascii
          while ($true) {
            $os = Get-CimInstance Win32_OperatingSystem
            $total = $os.TotalVisibleMemorySize / 1MB
            $free = $os.FreePhysicalMemory / 1MB
            ('{0},{1:N1},{2:N1}' -f (Get-Date -Format 'HH:mm:ss'), ($total - $free), $free) | Add-Content $log
            Start-Sleep -Seconds 20
          }
          '@
          $path = Join-Path $env:RUNNER_TEMP 'memory-sampler.ps1'
          Set-Content -Path $path -Value $script
          $p = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$path -PassThru -WindowStyle Hidden
          $p.Id | Out-File (Join-Path $env:RUNNER_TEMP 'memory-sampler.pid')
          "started memory sampler, pid $($p.Id)"

      - name: Build PyTorch wheel
        shell: powershell
        run: |
          python .github/scripts/windows-rocm-build/build_pytorch_rocm.py `
            --source-dir "$env:SOURCE_DIR" `
            --rocm-arch "$env:ROCM_ARCH" `
            --rocm-version "$env:ROCM_VERSION" `
            --index-url "$env:ROCM_INDEX_URL" `
            --output-dir "$env:PACKAGE_DIST_DIR" `
            --max-jobs "$env:MAX_JOBS" `
            --clean
          if ($LASTEXITCODE -ne 0) { throw "build_pytorch_rocm.py exited with $LASTEXITCODE" }

      # Storage numbers for sizing the Windows image.
      - name: Disk usage (after build)
        if: always()
        shell: powershell
        run: |
          $c = Get-PSDrive -Name C
          "C: used {0} GB, free {1} GB" -f [math]::Round($c.Used/1GB,1), [math]::Round($c.Free/1GB,1)
          function Get-SizeGB([string]$Path) {
            if (-not (Test-Path $Path)) { return 'missing' }
            $sum = (Get-ChildItem -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            return [math]::Round($sum/1GB, 2)
          }
          $paths = @(
            "$env:SOURCE_DIR",
            "$env:SOURCE_DIR/build",
            "$env:SOURCE_DIR/dist",
            "$env:GITHUB_WORKSPACE",
            "$env:RUNNER_TOOL_CACHE",
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:TEMP"
          )
          foreach ($p in $paths) { "{0,-60} {1} GB" -f $p, (Get-SizeGB $p) }

      - name: Memory report
        if: always()
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'memory-log.csv'
          $pidFile = Join-Path $env:RUNNER_TEMP 'memory-sampler.pid'
          if (Test-Path $pidFile) { Stop-Process -Id ([int](Get-Content $pidFile)) -ErrorAction SilentlyContinue }
          if (Test-Path $log) {
            $rows = @(Import-Csv $log)
            $used = $rows | ForEach-Object { [double]$_.used_gb }
            $free = $rows | ForEach-Object { [double]$_.free_gb }
            $total = [math]::Round((Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize / 1MB, 1)
            "Samples: $($rows.Count)  Total RAM: $total GB"
            "Peak used: $(($used | Measure-Object -Maximum).Maximum) GB   Minimum free: $(($free | Measure-Object -Minimum).Minimum) GB"
            'Every 12th sample (about 4 minutes):'
            for ($i = 0; $i -lt $rows.Count; $i += 12) { '{0}  used {1} GB  free {2} GB' -f $rows[$i].time, $rows[$i].used_gb, $rows[$i].free_gb }
          } else { 'no memory log found' }

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytorch-rocm-windows-wheels-py${{ env.PYTHON_VERSION }}
          path: ${{ env.PACKAGE_DIST_DIR }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Test job. Starts after a successful build, on a new VM with the same labels (the
  # R9700 VM has the GPU), installs the wheel built above into a fresh virtual environment
  # and runs PyTorch's own test runner (test/run_test.py) on the GPU. Nothing in this job
  # comes from TheRock: the test sources are plain git, the venv is plain `python -m venv`,
  # and the test command is the upstream one.
  #
  # Suites: test_torch, test_cuda, test_autograd, test_unary_ufuncs, test_binary_ufuncs.
  # They are AMD's documented PyTorch-on-ROCm check (test_nn, test_ops left out: test_nn is
  # excluded on Windows by PyTorch's own blocklist, test_ops had Triton problems).
  #
  # No skip list yet. The earlier TheRock-based runs deselected a few hundred known-bad
  # tests; this job starts from a plain upstream baseline, and the list of tests that must
  # pass (and which are skipped) is to be agreed and added once the first results are in.
  # ---------------------------------------------------------------------------
  test:
    name: Test | ${{ inputs.rocm_arch || 'gfx1200;gfx1201' }}
    needs: [resolve-sha, build]
    if: ${{ inputs.skip_tests != true }}
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted","Windows","xsj-dispatch","radeon-r9700"]') }}
    timeout-minutes: 180
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      PYTORCH_REPOSITORY: ${{ inputs.pytorch_repository || 'pytorch/pytorch' }}
      PYTORCH_SHA: ${{ needs.resolve-sha.outputs.sha }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.1.0' }}
      ROCM_INDEX_URL: ${{ inputs.rocm_index_url || 'https://stable.repo.amd.com/rocm/whl-next/' }}
      TEST_DEVICE_EXTRAS: ${{ inputs.test_device_extras || 'device-gfx1200,device-gfx1201' }}
      # Test sources (a plain checkout; the tests import the torch installed in the venv).
      TEST_SOURCE_DIR: C:/pytorch
      # Pin OpenBLAS threads to 1 for deterministic reductions.
      OPENBLAS_NUM_THREADS: "1"
      PYTORCH_NUM_PYTEST_RERUNS: "2"
    defaults:
      run:
        shell: bash
    steps:
      # The machine may be bare, so the first steps use PowerShell (bash comes with Git for
      # Windows, which the setup script installs when it is missing).
      - name: Enable git long paths (if git is installed)
        shell: powershell
        run: |
          if (Get-Command git -ErrorAction SilentlyContinue) {
            git config --global core.longpaths true
            'core.longpaths set'
          } else {
            'git is not installed yet: the checkout will use the REST API'
          }

      - name: Checkout the setup script (this repository, sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/windows-build-env
          sparse-checkout-cone-mode: true

      - name: Install missing tools
        shell: powershell
        run: |
          & ./.github/scripts/windows-build-env/setup-build-env.ps1 -SkipPython
          if ($LASTEXITCODE -ne 0) { throw "setup-build-env.ps1 exited with $LASTEXITCODE" }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the wheel built above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytorch-rocm-windows-wheels-py${{ env.PYTHON_VERSION }}
          path: wheels

      # The venv lives in the runner temp folder under a name unique to this run, so a folder
      # left on a persistent machine by an earlier job cannot break the setup. The wheel's
      # own dependencies come from PyPI; the rocm package (and the GPU kernels it carries
      # for this machine, through the device extras) from the ROCm index.
      - name: Set up virtual environment and install the wheel
        timeout-minutes: 15
        run: |
          ls -l wheels
          TORCH_WHEEL="$(ls wheels/torch-*.whl | head -n 1)"
          VENV_DIR="${RUNNER_TEMP}/venv-${GITHUB_RUN_ID}"
          python -m venv "${VENV_DIR}"
          echo "VENV_DIR=${VENV_DIR}" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$(cygpath -w "${VENV_DIR}")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "${VENV_DIR}/Scripts")" >> "$GITHUB_PATH"
          VENV_PYTHON="${VENV_DIR}/Scripts/python.exe"
          "${VENV_PYTHON}" -m pip install --upgrade pip
          echo "Installing ${TORCH_WHEEL} and rocm[${TEST_DEVICE_EXTRAS}]==${ROCM_VERSION}"
          "${VENV_PYTHON}" -m pip install --no-cache-dir \
            "${TORCH_WHEEL}" "rocm[${TEST_DEVICE_EXTRAS}]==${ROCM_VERSION}" \
            --extra-index-url "${ROCM_INDEX_URL}"
          "${VENV_PYTHON}" -m pip list

      # The test files must match the wheel: the same PyTorch commit the build job built.
      - name: Checkout PyTorch test sources
        timeout-minutes: 30
        run: |
          set -euo pipefail
          rm -rf "${TEST_SOURCE_DIR}"
          mkdir -p "${TEST_SOURCE_DIR}"
          cd "${TEST_SOURCE_DIR}"
          git init --initial-branch=main
          git config advice.detachedHead false
          git remote add origin "https://github.com/${PYTORCH_REPOSITORY}.git"
          git fetch --depth 1 origin "${PYTORCH_SHA}"
          git checkout FETCH_HEAD
          echo "Test sources:"
          git log -1 --format='%H %s'
          echo "Installed wheel reports git version: $(python -c 'import torch; print(torch.version.git_version)')"

      - name: Install test requirements
        run: |
          python -m pip install pytest pytest-timeout pytest-xdist expecttest hypothesis ninja numpy psutil
          python -m pip install -r "${TEST_SOURCE_DIR}/.ci/docker/requirements-ci.txt"
          pip freeze

      # Does the venv's torch see the GPU, and can it run a kernel? Fails early (with the
      # driver and device printed) when the VM has no usable GPU.
      - name: GPU smoke check
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import torch
          print("torch", torch.__version__, "| hip", torch.version.hip, "| git", torch.version.git_version)
          assert torch.cuda.is_available(), "torch.cuda.is_available() is False: no usable GPU or driver"
          props = torch.cuda.get_device_properties(0)
          print("device:", torch.cuda.get_device_name(0), "| arch:", getattr(props, "gcnArchName", "n/a"),
                "| memory GB:", round(props.total_memory / 2**30, 1))
          a = torch.randn(512, 512, device="cuda")
          b = torch.randn(512, 512, device="cuda")
          c = a @ b
          torch.cuda.synchronize()
          print("matmul on the GPU ok:", float(c.sum()))
          PY

      - name: Run rocm-sdk sanity tests
        timeout-minutes: 5
        run: |
          rocm-sdk test

      # The environment below is what PyTorch's own CI sets for ROCm test runs; the values are
      # the same ones the earlier TheRock-based test jobs used, so results stay comparable.
      # Add --shard N M to the command if a run ever needs to be split (one shard took about
      # 12 minutes on a gfx1201 machine in the October runs).
      - name: Run PyTorch tests
        timeout-minutes: 120
        run: |
          export CI=1
          export BUILD_ENVIRONMENT="linux-noble-rocm-py3.12-mi300"
          export PYTORCH_TEST_WITH_ROCM=1
          export PYTORCH_TESTING_DEVICE_ONLY_FOR=cuda
          export PYTORCH_PRINT_REPRO_ON_FAILURE=0
          export TORCH_SERIALIZATION_DEBUG=1
          export TEST_CONFIG=default
          export PYTORCH_TEST_RUN_EVERYTHING_IN_SERIAL=1
          export MIOPEN_CUSTOM_CACHE_DIR="$(cygpath -w "$(mktemp -d)")"
          export PYTHONPATH="$(cygpath -w "${TEST_SOURCE_DIR}/test")"
          cd "${TEST_SOURCE_DIR}"
          python test/run_test.py \
            --keep-going \
            --verbose \
            --include \
              test_torch \
              test_cuda \
              test_unary_ufuncs \
              test_binary_ufuncs \
              test_autograd \
            -p no:cacheprovider \
            --timeout 900 \
            --continue-on-collection-errors

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: ${{ env.TEST_SOURCE_DIR }}/test/test-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the venv
        if: always()
        run: |
          rm -rf "${VENV_DIR}" || true
