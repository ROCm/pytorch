name: ROCm Nightly Build Debug

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: ROCm version to debug
        required: false
        type: string
      pytorch_source_sha:
        description: PyTorch commit to debug
        required: false
        default: 8a6524408a49ab2293f694b43131d0fc17e45a32
        type: string
      target_ninja:
        description: Ninja target to rerun after a build failure, or auto
        required: false
        default: auto
        type: string
  push:
    branches:
      - rocm-nightly-gha
    paths:
      - .github/workflows/rocm-nightly-debug-build.yml
      - .github/scripts/rocm_nightly_debug_build.sh

env:
  ROCM_VERSION: '7.2.2'
  PYTHON_VERSION: '3.10'
  PYTORCH_ROCM_ARCH: 'gfx906;gfx908;gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201'
  PYTORCH_SOURCE_SHA: '8a6524408a49ab2293f694b43131d0fc17e45a32'
  TARGET_NINJA: 'auto'

jobs:
  debug-build:
    name: Debug ROCm Nightly Image Build
    runs-on: linux-pytorch-mi325-1
    timeout-minutes: 300
    steps:
      - name: Resolve ROCm version
        if: ${{ inputs.rocm_version != '' }}
        run: echo "ROCM_VERSION=${{ inputs.rocm_version }}" >> "$GITHUB_ENV"

      - name: Resolve PyTorch source SHA
        if: ${{ inputs.pytorch_source_sha != '' }}
        run: echo "PYTORCH_SOURCE_SHA=${{ inputs.pytorch_source_sha }}" >> "$GITHUB_ENV"

      - name: Resolve debug ninja target
        if: ${{ inputs.target_ninja != '' }}
        run: echo "TARGET_NINJA=${{ inputs.target_ninja }}" >> "$GITHUB_ENV"

      - name: Checkout pytorch
        uses: actions/checkout@v6
        with:
          repository: pytorch/pytorch
          ref: main

      - name: Checkout nightly workflow files
        uses: actions/checkout@v6
        with:
          path: rocm-nightly-workflow

      - name: Patch rocm-n build.sh version
        run: |
          sed -i '/pytorch-linux-jammy-rocm-n-py3 | pytorch-linux-jammy-rocm-n-py3-benchmarks | pytorch-linux-noble-rocm-n-py3)/,/;;/ s/ROCM_VERSION=7\.2/ROCM_VERSION=${{ env.ROCM_VERSION }}/' .ci/docker/build.sh
          sed -n '/pytorch-linux-jammy-rocm-n-py3 | pytorch-linux-jammy-rocm-n-py3-benchmarks | pytorch-linux-noble-rocm-n-py3)/,/;;/p' .ci/docker/build.sh

      - name: Build base image
        working-directory: .ci/docker
        run: |
          export PYTORCH_ROCM_ARCH="${{ env.PYTORCH_ROCM_ARCH }}"
          ./build.sh pytorch-linux-jammy-rocm-n-py3 \
            -t rocm/pytorch-autobuild:base-latest

      - name: Run debug build
        run: |
          mkdir -p debug-artifacts
          # The debug image runs as the `jenkins` user, so the bind mount must
          # be writable even when the host runner uid/gid does not match.
          chmod 0777 debug-artifacts
          docker run --rm \
            -e ARTIFACT_DIR=/debug-artifacts \
            -e BUILD_ENVIRONMENT="pytorch-linux-jammy-rocm-n-py3" \
            -e ANACONDA_PYTHON_VERSION="${{ env.PYTHON_VERSION }}" \
            -e CI=1 \
            -e PYTORCH_ROCM_ARCH="${{ env.PYTORCH_ROCM_ARCH }}" \
            -e PYTORCH_SOURCE_SHA="${{ env.PYTORCH_SOURCE_SHA }}" \
            -e TARGET_NINJA="${{ env.TARGET_NINJA }}" \
            -v "$PWD/rocm-nightly-workflow:/workspace/rocm-nightly-workflow" \
            -v "$PWD/debug-artifacts:/debug-artifacts" \
            rocm/pytorch-autobuild:base-latest \
            bash /workspace/rocm-nightly-workflow/.github/scripts/rocm_nightly_debug_build.sh

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: rocm-nightly-debug-artifacts
          path: debug-artifacts
          retention-days: 7
          compression-level: 0
