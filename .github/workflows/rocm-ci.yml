name: ROCm CI

on:
  pull_request:
    branches:
      - release/**
  push:
    branches:
      - release/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  BUILD_ENVIRONMENT: linux-noble-rocm-py3.12-gfx942
  CI: "1"
  DOCKER_IMAGE_NAME: pytorch-linux-noble-rocm7.2.4-py3.12
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: http.lowSpeedLimit
  GIT_CONFIG_VALUE_0: "1024"
  GIT_CONFIG_KEY_1: http.lowSpeedTime
  GIT_CONFIG_VALUE_1: "60"
  GIT_CONFIG_KEY_2: submodule.fetchJobs
  GIT_CONFIG_VALUE_2: "4"
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MAX_JOBS: 58
  PYTORCH_ROCM_ARCH: gfx942
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_DIRECT: "false"
  SCCACHE_GHA_ENABLED: "true"
  SKIP_SCCACHE_INITIALIZATION: "1"

jobs:
  docker-image:
    name: docker-image
    if: >-
      github.repository == 'ROCm/pytorch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: build-only-pytorch
    timeout-minutes: 180
    outputs:
      ci-docker-hash: ${{ steps.calculate.outputs.ci-docker-hash }}
    steps:
      - name: Checkout PyTorch
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          show-progress: false
          sparse-checkout: .ci/docker

      - name: Calculate docker image
        id: calculate
        run: |
          ci_docker_hash=$(git rev-parse HEAD:.ci/docker)
          docker_image="rocm/pytorch-ci-private:${DOCKER_IMAGE_NAME}-${ci_docker_hash}-${PYTORCH_ROCM_ARCH//;/_}"
          echo "ci-docker-hash=${ci_docker_hash}" >> "${GITHUB_OUTPUT}"
          echo "docker-image=${docker_image}" >> "${GITHUB_OUTPUT}"
          if manifest=$(docker manifest inspect "${docker_image}" 2>&1); then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${manifest}" != *"no such manifest"* ]]; then
            echo "${manifest}"
            exit 1
          fi

      - name: Build docker image
        if: steps.calculate.outputs.exists != 'true'
        working-directory: .ci/docker
        env:
          DOCKER_IMAGE: ${{ steps.calculate.outputs.docker-image }}
        run: ./build.sh "${DOCKER_IMAGE_NAME}" -t "${DOCKER_IMAGE}"

      - name: Push docker image
        if: steps.calculate.outputs.exists != 'true'
        env:
          DOCKER_IMAGE: ${{ steps.calculate.outputs.docker-image }}
        run: docker push "${DOCKER_IMAGE}"

  build:
    name: build
    needs: docker-image
    runs-on: build-only-pytorch
    timeout-minutes: 120
    outputs:
      artifact-name: rocm-gfx942-build-${{ github.run_attempt }}
    container:
      image: rocm/pytorch-ci-private:pytorch-linux-noble-rocm7.2.4-py3.12-${{ needs.docker-image.outputs.ci-docker-hash }}-gfx942
      options: >-
        --user=0
        --cpus=58
        --memory=192g
        --memory-swap=192g
        --shm-size=32g
    steps:
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        timeout-minutes: 80
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          PYTORCH_CHECKOUT_ATTEMPT: initial
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          show-progress: false
          submodules: recursive

      - name: Discard interrupted checkout
        id: checkout_cleanup
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          # Cancelling docker exec can leave checkout and Git running inside the container.
          checkout_pids() {
            grep -lsxz PYTORCH_CHECKOUT_ATTEMPT=initial /proc/[0-9]*/environ | cut -d/ -f3 || true
          }
          for _ in {1..30}; do
            pids=$(checkout_pids)
            [[ -z "${pids}" ]] && break
            kill -KILL ${pids} 2> /dev/null || true
            sleep 0.1
          done
          if [[ -n "$(checkout_pids)" ]]; then
            echo "Interrupted checkout processes survived cleanup"
            exit 1
          fi
          rm -rf -- .git

      - name: Retry checkout PyTorch
        if: >-
          ${{ !cancelled() && steps.checkout.outcome == 'failure' &&
              steps.checkout_cleanup.outcome == 'success' }}
        timeout-minutes: 80
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          show-progress: false
          submodules: recursive

      - name: Configure sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Build PyTorch
        env:
          SCCACHE_LOG: sccache::server=debug
        run: .ci/pytorch/build.sh

      - name: Archive build artifact
        run: tar -cf artifacts.tar dist/ build/custom_test_artifacts build/lib build/bin .additional_ci_files

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-gfx942-build-${{ github.run_attempt }}
          path: artifacts.tar
          compression-level: 1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  test:
    name: test / ${{ matrix.config }} / ${{ matrix.shard }} of ${{ matrix.num_shards }}
    needs:
      - docker-image
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 540
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: default, shard: 1, num_shards: 2, runner: linux-pytorch-mi325-1 }
          - { config: default, shard: 2, num_shards: 2, runner: linux-pytorch-mi325-1 }
          - { config: distributed, shard: 1, num_shards: 2, runner: linux-pytorch-mi325-4 }
          - { config: distributed, shard: 2, num_shards: 2, runner: linux-pytorch-mi325-4 }
          - { config: inductor, shard: 1, num_shards: 2, runner: linux-pytorch-mi325-1 }
          - { config: inductor, shard: 2, num_shards: 2, runner: linux-pytorch-mi325-1 }
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      DOCKER_IMAGE: rocm/pytorch-ci-private:pytorch-linux-noble-rocm7.2.4-py3.12-${{ needs.docker-image.outputs.ci-docker-hash }}-gfx942
      GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAX_JOBS: 6
      NUM_TEST_SHARDS: ${{ matrix.num_shards }}
      OMP_NUM_THREADS: 4
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REQUIRED_GPU_COUNT: ${{ matrix.config == 'distributed' && '4' || '1' }}
      SHARD_NUMBER: ${{ matrix.shard }}
      SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_CONFIG: ${{ matrix.config }}
      TESTS_TO_INCLUDE: >-
        ${{
          matrix.config == 'default' && 'test_nn test_torch test_cuda test_ops test_unary_ufuncs test_binary_ufuncs test_autograd inductor/test_torchinductor' ||
          matrix.config == 'distributed' && 'distributed/test_c10d_common distributed/test_c10d_nccl distributed/test_distributed_spawn' ||
          ''
        }}
      USE_ARC: "1"
    steps:
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        timeout-minutes: 80
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          show-progress: false
          submodules: recursive

      - name: Discard interrupted checkout
        id: checkout_cleanup
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        timeout-minutes: 2
        run: rm -rf -- .git

      - name: Retry checkout PyTorch
        if: >-
          ${{ !cancelled() && steps.checkout.outcome == 'failure' &&
              steps.checkout_cleanup.outcome == 'success' }}
        timeout-minutes: 80
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
          show-progress: false
          submodules: recursive

      - name: Download build artifact
        id: download
        continue-on-error: true
        timeout-minutes: 80
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Validate build artifact
        id: validate_artifact
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: tar -tf artifacts.tar > /dev/null

      - name: Discard invalid build artifact
        id: artifact_cleanup
        if: >-
          ${{ !cancelled() && (steps.download.outcome == 'failure' ||
              steps.validate_artifact.outcome == 'failure') }}
        timeout-minutes: 1
        run: rm -f -- artifacts.tar

      - name: Retry download build artifact
        if: ${{ !cancelled() && steps.artifact_cleanup.outcome == 'success' }}
        timeout-minutes: 80
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Extract build artifact
        timeout-minutes: 5
        run: |
          tar -xf artifacts.tar
          rm artifacts.tar

      - name: Start test container
        timeout-minutes: 30
        run: |
          read -ra gpu_flags < /etc/podinfo/gha-render-devices
          test_container=$(docker run \
            --detach \
            --tty \
            --user=0 \
            --cpus=19 \
            --memory=160g \
            --memory-swap=160g \
            --device=/dev/mem \
            --device=/dev/kfd \
            "${gpu_flags[@]}" \
            --group-add video \
            --group-add daemon \
            --group-add bin \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --shm-size=8g \
            --ulimit stack=10485760:83886080 \
            --ulimit core=0 \
            -e BASE_SHA \
            -e BRANCH \
            -e BUILD_ENVIRONMENT \
            -e CI \
            -e GIT_DEFAULT_BRANCH \
            -e GITHUB_ACTIONS \
            -e GITHUB_JOB \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER \
            -e GITHUB_WORKFLOW \
            -e MAX_JOBS \
            -e NUM_TEST_SHARDS \
            -e OMP_NUM_THREADS \
            -e PR_NUMBER \
            -e PYTORCH_ROCM_ARCH \
            -e REQUIRED_GPU_COUNT \
            -e SCCACHE_CACHE_SIZE \
            -e SCCACHE_DIRECT \
            -e SCCACHE_GHA_ENABLED \
            -e SHA1 \
            -e SHARD_NUMBER \
            -e SKIP_SCCACHE_INITIALIZATION \
            -e TEST_CONFIG \
            -e TESTS_TO_INCLUDE \
            -e USE_ARC \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${DOCKER_IMAGE}")
          echo "TEST_CONTAINER=${test_container}" >> "${GITHUB_ENV}"
          docker exec "${test_container}" git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Verify gfx942 runner
        run: |
          rocminfo_output=$(docker exec "${TEST_CONTAINER}" rocminfo)
          printf '%s\n' "$rocminfo_output"
          gpu_count=$(grep -c -E 'Name:.*\sgfx942' <<< "$rocminfo_output" || true)
          if (( gpu_count != REQUIRED_GPU_COUNT )); then
            echo "Expected ${REQUIRED_GPU_COUNT} gfx942 GPUs, found ${gpu_count}"
            exit 1
          fi

      - name: Install PyTorch wheel
        timeout-minutes: 5
        run: docker exec "${TEST_CONTAINER}" python -m pip install dist/*.whl

      - name: Verify PyTorch GPU visibility
        run: |
          docker exec -i -w "${GITHUB_WORKSPACE}/test" "${TEST_CONTAINER}" python - <<'PY'
          import os

          import amdsmi
          import torch

          expected = int(os.environ["REQUIRED_GPU_COUNT"])
          if torch.version.hip is None:
              raise RuntimeError("The installed PyTorch wheel has no ROCm support")
          if torch.cuda.device_count() != expected:
              raise RuntimeError(f"Expected {expected} visible GPUs, found {torch.cuda.device_count()}")
          amdsmi.amdsmi_init()
          amdsmi_count = len(amdsmi.amdsmi_get_processor_handles())
          if amdsmi_count != expected:
              raise RuntimeError(f"Expected amdsmi to see {expected} GPUs, found {amdsmi_count}")
          PY

      - name: Configure sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Run tests
        timeout-minutes: 480
        run: >-
          docker exec
          -e ACTIONS_CACHE_SERVICE_V2
          -e ACTIONS_RESULTS_URL
          -e ACTIONS_RUNTIME_TOKEN
          "${TEST_CONTAINER}"
          .ci/pytorch/test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-gfx942-reports-${{ github.run_attempt }}-${{ matrix.config }}-${{ matrix.shard }}
          path: test/test-reports/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: test/test-reports/**/*.xml
          annotate_only: true
          detailed_summary: true

      - name: Stop test container
        if: always() && env.TEST_CONTAINER != ''
        run: docker rm --force "${TEST_CONTAINER}"

  required:
    name: ROCm CI
    if: ${{ !cancelled() && github.repository == 'ROCm/pytorch' }}
    needs:
      - docker-image
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DOCKER_IMAGE_RESULT: ${{ needs.docker-image.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$FORK_PR" == true ]]; then
            echo "ROCm CI does not run on fork pull requests; push the branch to ROCm/pytorch to run it"
            exit 1
          fi
          if [[ "$DOCKER_IMAGE_RESULT" != success || "$BUILD_RESULT" != success || "$TEST_RESULT" != success ]]; then
            echo "docker-image=${DOCKER_IMAGE_RESULT} build=${BUILD_RESULT} test=${TEST_RESULT}"
            exit 1
          fi
