<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200" role="img" aria-labelledby="title desc">
  <title id="title">ROCm CI workflow</title>
  <desc id="desc">A native GitHub Actions workflow using job containers, a test matrix, sccache, and artifacts for gfx942-only PyTorch CI.</desc>
  <defs>
    <style>
      .title { font: 700 40px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; letter-spacing: 0; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #596675; letter-spacing: 0; }
      .section { font: 700 14px Inter, "Segoe UI", Arial, sans-serif; fill: #6b7785; letter-spacing: 0; }
      .heading { font: 700 23px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; letter-spacing: 0; }
      .heading-light { font: 700 23px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .body { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #394655; letter-spacing: 0; }
      .body-strong { font: 650 15px Inter, "Segoe UI", Arial, sans-serif; fill: #263342; letter-spacing: 0; }
      .body-light { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #eaf0f5; letter-spacing: 0; }
      .small { font: 500 13px Inter, "Segoe UI", Arial, sans-serif; fill: #596675; letter-spacing: 0; }
      .small-light { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #eaf0f5; letter-spacing: 0; }
      .mono { font: 600 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #263342; letter-spacing: 0; }
      .mono-light { font: 600 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #ffffff; letter-spacing: 0; }
      .step { font: 700 14px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .metric { font: 700 16px Inter, "Segoe UI", Arial, sans-serif; fill: #1f6f4a; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7d0d9; stroke-width: 2; }
      .arrow { fill: none; stroke: #7d8996; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-soft { fill: none; stroke: #a8b2bd; stroke-width: 2; marker-end: url(#arrowhead-soft); }
      .divider { stroke: #d5dde4; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7d8996"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b2bd"/>
    </marker>
  </defs>

  <rect width="1800" height="2200" fill="#f6f8fa"/>
  <rect width="1800" height="12" fill="#e85d4a"/>

  <text class="title" x="80" y="72">ROCm CI</text>
  <text class="subtitle" x="80" y="106">One build job, one matrix test job, and standard Actions for checkout and artifacts.</text>

  <text class="section" x="80" y="154">WORKFLOW TRIGGERS</text>
  <rect class="card" x="80" y="176" width="520" height="96" rx="8"/>
  <rect x="80" y="176" width="8" height="96" rx="4" fill="#e85d4a"/>
  <text class="heading" x="112" y="216">pull_request</text>
  <text class="body" x="112" y="246">release/2.11, release/2.12, release/2.13, release/2.14</text>

  <rect class="card" x="640" y="176" width="520" height="96" rx="8"/>
  <rect x="640" y="176" width="8" height="96" rx="4" fill="#27865c"/>
  <text class="heading" x="672" y="208">push: release/2.11, release/2.12</text>
  <text class="heading" x="672" y="236">release/2.13, release/2.14</text>
  <text class="small" x="672" y="260">Validate maintained release branches</text>

  <rect class="card" x="1200" y="176" width="520" height="96" rx="8"/>
  <rect x="1200" y="176" width="8" height="96" rx="4" fill="#c17b18"/>
  <text class="heading" x="1232" y="216">workflow_dispatch</text>
  <text class="body" x="1232" y="246">Run the same build and test matrix on demand</text>

  <path class="arrow-soft" d="M 340 272 L 340 306 L 760 306 L 760 338"/>
  <path class="arrow-soft" d="M 900 272 L 900 338"/>
  <path class="arrow-soft" d="M 1460 272 L 1460 306 L 1040 306 L 1040 338"/>

  <rect x="500" y="340" width="800" height="92" rx="8" fill="#243447"/>
  <text class="heading-light" x="540" y="379">rocm-ci.yml</text>
  <text class="body-light" x="540" y="407">read-only permissions | same-repository PRs only | cancel superseded runs</text>
  <text class="mono-light" x="1260" y="379" text-anchor="end">concurrency: rocm-gfx942-${PR-or-ref}</text>

  <path class="arrow" d="M 900 432 L 900 478"/>

  <rect x="60" y="480" width="1680" height="770" rx="8" fill="#edf3f7" stroke="#8ea5b7" stroke-width="2"/>
  <rect x="60" y="480" width="1680" height="74" rx="8" fill="#2575a7"/>
  <rect x="60" y="538" width="1680" height="16" fill="#2575a7"/>
  <text class="heading-light" x="100" y="526">Job: build</text>
  <text class="mono-light" x="1700" y="526" text-anchor="end">runs-on: build-only-pytorch | timeout-minutes: 120</text>

  <rect x="100" y="590" width="500" height="612" rx="8" fill="#ffffff" stroke="#2575a7" stroke-width="2"/>
  <text class="heading" x="130" y="630">Native job definition</text>
  <line class="divider" x1="130" y1="650" x2="570" y2="650"/>
  <text class="mono" x="130" y="682">container:</text>
  <text class="mono" x="150" y="708">image: rocm/pytorch-ci-private:&lt;gfx942 tag&gt;</text>
  <text class="small" x="150" y="732">Content-hashed Docker Hub image; Actions creates it</text>
  <text class="mono" x="130" y="770">env:</text>
  <text class="mono" x="150" y="796">BUILD_ENVIRONMENT: linux-noble-rocm-py3.12-gfx942</text>
  <text class="mono" x="150" y="822">PYTORCH_ROCM_ARCH: gfx942</text>
  <text class="mono" x="150" y="848">CI: 1</text>
  <text class="mono" x="150" y="874">SCCACHE_GHA_ENABLED: "true"</text>
  <text class="mono" x="150" y="900">SCCACHE_CACHE_SIZE: 10G</text>
  <line class="divider" x1="130" y1="926" x2="570" y2="926"/>
  <text class="body-strong" x="130" y="958">What the runner does automatically</text>
  <text class="body" x="130" y="988">- Pulls and starts the Docker Hub job container</text>
  <text class="body" x="130" y="1016">- Mounts the workspace and runner temp directories</text>
  <text class="body" x="130" y="1044">- Executes every action and run step in the container</text>
  <text class="body" x="130" y="1072">- Cleans up the job container after completion</text>
  <rect x="130" y="1102" width="440" height="72" rx="6" fill="#fff0ed" stroke="#d76653" stroke-width="2"/>
  <text class="body-strong" x="150" y="1132">Repository prerequisite</text>
  <text class="small" x="150" y="1158">The build script must honor the gfx942-only arch value.</text>

  <rect class="card" x="650" y="590" width="1010" height="104" rx="8"/>
  <circle cx="682" cy="622" r="18" fill="#2575a7"/>
  <text class="step" x="682" y="627" text-anchor="middle">1</text>
  <text class="heading" x="715" y="630">Checkout</text>
  <text class="mono" x="715" y="661">uses: actions/checkout@v4</text>
  <text class="mono" x="1110" y="630">with: { fetch-depth: 1, submodules: recursive }</text>
  <text class="small" x="1110" y="660">Checkout the PR head SHA or github.sha directly into the job container.</text>

  <path class="arrow-soft" d="M 1155 694 L 1155 716"/>

  <rect class="card" x="650" y="718" width="1010" height="132" rx="8"/>
  <circle cx="682" cy="750" r="18" fill="#2575a7"/>
  <text class="step" x="682" y="755" text-anchor="middle">2</text>
  <text class="heading" x="715" y="758">Compiler cache configuration</text>
  <text class="mono" x="715" y="789">SCCACHE_GHA_ENABLED=true</text>
  <text class="body" x="1080" y="786">Compiler objects stream to the Actions cache service</text>
  <text class="body" x="1080" y="812">No directory restore or end-of-job cache upload</text>
  <text class="small" x="1080" y="838">Build script uses lazy startup and reports statistics</text>

  <path class="arrow-soft" d="M 1155 850 L 1155 856"/>

  <rect x="650" y="858" width="1010" height="212" rx="8" fill="#ffffff" stroke="#2575a7" stroke-width="3"/>
  <circle cx="682" cy="890" r="18" fill="#2575a7"/>
  <text class="step" x="682" y="895" text-anchor="middle">3</text>
  <text class="heading" x="715" y="898">Build PyTorch</text>
  <text class="mono" x="715" y="930">run: .ci/pytorch/build.sh</text>
  <line class="divider" x1="715" y1="952" x2="1628" y2="952"/>
  <text class="body" x="715" y="980">Hipify sources for gfx942</text>
  <text class="mono" x="1030" y="980">python tools/amd_build/build_amd.py</text>
  <text class="body" x="715" y="1008">Build and install the wheel</text>
  <text class="mono" x="1030" y="1008">python -m build --wheel --no-isolation</text>
  <text class="body" x="715" y="1036">Produce test inputs</text>
  <text class="body" x="1030" y="1036">CK wheel, custom-op, JIT-hook, backend binaries, test times</text>
  <text class="small" x="715" y="1058">No container lifecycle scripting in the workflow; this is the repository's build command.</text>

  <path class="arrow-soft" d="M 1155 1070 L 1155 1092"/>

  <rect class="card" x="650" y="1094" width="1010" height="144" rx="8"/>
  <circle cx="682" cy="1126" r="18" fill="#2575a7"/>
  <text class="step" x="682" y="1131" text-anchor="middle">4</text>
  <text class="heading" x="715" y="1134">Publish build artifact</text>
  <text class="mono" x="715" y="1165">uses: actions/upload-artifact@v4</text>
  <text class="small" x="715" y="1194">retention-days: 14 | compression-level: 0</text>
  <text class="small" x="715" y="1218">include-hidden-files: true</text>
  <text class="mono" x="1110" y="1124">name: rocm-gfx942-build</text>
  <text class="mono" x="1110" y="1186">paths: dist/  build/custom_test_artifacts/  build/lib/</text>
  <text class="mono" x="1110" y="1212">       build/bin/  .additional_ci_files/</text>

  <path class="arrow" d="M 900 1250 L 900 1296"/>

  <text class="section" x="80" y="1302">ONE NATIVE MATRIX JOB</text>
  <rect x="60" y="1324" width="1680" height="494" rx="8" fill="#f1f4f6" stroke="#a5b2be" stroke-width="2"/>
  <rect x="60" y="1324" width="1680" height="70" rx="8" fill="#34495e"/>
  <rect x="60" y="1378" width="1680" height="16" fill="#34495e"/>
  <text class="heading-light" x="100" y="1368">Job: test</text>
  <text class="mono-light" x="1700" y="1368" text-anchor="end">runs-on: ${{ matrix.runner }} | needs: build | timeout: 120m | fail-fast: false</text>

  <rect class="card" x="100" y="1430" width="490" height="180" rx="8"/>
  <rect x="100" y="1430" width="490" height="10" rx="5" fill="#167c80"/>
  <text class="heading" x="130" y="1478">Default</text>
  <text class="mono" x="130" y="1510">6 shards | linux-pytorch-mi325-1</text>
  <text class="mono" x="130" y="1542">TEST_CONFIG=default</text>
  <text class="body" x="130" y="1574">Duration-balanced by exported test timing data</text>

  <rect class="card" x="655" y="1430" width="490" height="180" rx="8"/>
  <rect x="655" y="1430" width="490" height="10" rx="5" fill="#b84c5a"/>
  <text class="heading" x="685" y="1478">Distributed</text>
  <text class="mono" x="685" y="1510">3 shards | linux-pytorch-mi325-4</text>
  <text class="mono" x="685" y="1542">TEST_CONFIG=distributed</text>
  <text class="body" x="685" y="1574">Four GPUs exposed through container.options</text>

  <rect class="card" x="1210" y="1430" width="490" height="180" rx="8"/>
  <rect x="1210" y="1430" width="490" height="10" rx="5" fill="#6657a8"/>
  <text class="heading" x="1240" y="1478">Inductor</text>
  <text class="mono" x="1240" y="1510">2 shards | linux-pytorch-mi325-1</text>
  <text class="mono" x="1240" y="1542">TEST_CONFIG=inductor</text>
  <text class="body" x="1240" y="1574">Runs concurrently with every other test shard</text>

  <rect x="100" y="1644" width="1600" height="158" rx="8" fill="#ffffff" stroke="#c7d0d9" stroke-width="2"/>
  <text class="mono" x="130" y="1674">runs-on: ${{ matrix.runner }} | container.image: rocm/pytorch-ci-private:&lt;gfx942 tag&gt;</text>
  <text class="mono" x="130" y="1702">container.options: --env-file /etc/podinfo/gha-gpu-isolation-settings | /dev/kfd + /dev/dri | shm 8g</text>
  <text class="mono" x="130" y="1730">steps: checkout -&gt; download artifact -&gt; restore modes -&gt; verify exact gfx942 visibility</text>
  <text class="mono" x="130" y="1758">run: pip install dist/*.whl -&gt; verify torch.cuda.device_count() -&gt; .ci/pytorch/test.sh</text>
  <text class="mono" x="130" y="1786">if: always() | actions/upload-artifact@v4 | name: reports-${{ matrix.config }}-${{ matrix.shard }} | path: test/test-reports/**/*.xml</text>

  <path class="arrow" d="M 900 1818 L 900 1860"/>

  <rect x="360" y="1862" width="1080" height="118" rx="8" fill="#1f6f4a"/>
  <text class="heading-light" x="405" y="1908">Job: required</text>
  <text class="body-light" x="405" y="1938">needs: [build, test] | trusted ROCm/pytorch events | stable branch-protection check</text>
  <text class="small-light" x="405" y="1964">Fails unless both upstream jobs succeeded; matrix details remain individually visible.</text>

  <text class="section" x="80" y="2024">CLUSTER AND IMAGE INPUTS</text>
  <rect class="card" x="80" y="2044" width="800" height="140" rx="8"/>
  <text class="heading" x="110" y="2082">Runner scale sets</text>
  <text class="mono" x="110" y="2112">build-only-pytorch | linux-pytorch-mi325-1 | -4</text>
  <text class="small" x="110" y="2140">rocOps PR #1021 provisions CPU, one-GPU, and four-GPU pools</text>
  <text class="small" x="110" y="2168">ARC is privileged + hostNetwork: run only reviewed, trusted PR code</text>

  <rect class="card" x="920" y="2044" width="800" height="140" rx="8"/>
  <text class="heading" x="950" y="2082">CI image source</text>
  <text class="mono" x="950" y="2112">Docker Hub: rocm/pytorch-ci-private</text>
  <text class="small" x="950" y="2140">Content-hashed ROCm 7.2.4 / Python 3.12 / gfx942 CI tag</text>
  <text class="small" x="950" y="2168">Runner infrastructure supplies the existing Docker Hub credentials</text>
</svg>
